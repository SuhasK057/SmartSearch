<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    position: relative;
    overflow-x: hidden;
    color: #fff;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: -3;
    background: linear-gradient(180deg, #0a1130 0%, #16234f 35%, #2a4370 65%, #3f5a86 100%);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 25% 8%, #fff, transparent),
      radial-gradient(1px 1px at 40% 20%, #cdd8ff, transparent),
      radial-gradient(1.5px 1.5px at 60% 10%, #fff, transparent),
      radial-gradient(1px 1px at 75% 25%, #cdd8ff, transparent),
      radial-gradient(1.5px 1.5px at 85% 12%, #fff, transparent),
      radial-gradient(1px 1px at 95% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 15% 40%, #fff, transparent),
      radial-gradient(1px 1px at 50% 5%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 35%, #cdd8ff, transparent);
    background-repeat: repeat;
    background-size: 100% 45%;
    opacity: 0.9;
  }

  .shooting-star {
    position: fixed;
    width: 140px;
    height: 2px;
    background: linear-gradient(90deg, #fff, transparent);
    top: 12%;
    left: -10%;
    z-index: -1;
    transform: rotate(25deg);
    animation: shoot 6s linear infinite;
    opacity: 0;
  }
  .shooting-star.s2 { top: 22%; animation-delay: 2.3s; }
  .shooting-star.s3 { top: 6%;  animation-delay: 4.1s; }

  @keyframes shoot {
    0%   { transform: translate(0, 0) rotate(25deg); opacity: 0; }
    5%   { opacity: 1; }
    25%  { transform: translate(120vw, 60vh) rotate(25deg); opacity: 0; }
    100% { opacity: 0; }
  }

  .skyline {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 34%;
    z-index: -1;
    background:
      linear-gradient(0deg, rgba(4,8,25,0.95), rgba(4,8,25,0.4)),
      repeating-linear-gradient(90deg,
        #0d1530 0px, #0d1530 60px,
        #131c3d 60px, #131c3d 130px,
        #0a1030 130px, #0a1030 190px,
        #17204a 190px, #17204a 260px
      );
    box-shadow: 0 -40px 80px -20px rgba(60, 90, 160, 0.35) inset;
  }

  .skyline::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 8% 30%, #ffd97a, transparent),
      radial-gradient(1px 1px at 18% 55%, #ffd97a, transparent),
      radial-gradient(1px 1px at 32% 20%, #ffd97a, transparent),
      radial-gradient(1px 1px at 47% 60%, #ffd97a, transparent),
      radial-gradient(1px 1px at 61% 35%, #ffd97a, transparent),
      radial-gradient(1px 1px at 74% 50%, #ffd97a, transparent),
      radial-gradient(1px 1px at 88% 25%, #ffd97a, transparent);
    opacity: 0.7;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 34px;
    padding: 22px 48px;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
  }

  nav a {
    color: #eef1ff;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.15s;
  }
  nav a:hover { opacity: 1; }
  nav a.contact-btn {
    border: 1px solid rgba(255,255,255,0.5);
    padding: 7px 18px;
    border-radius: 20px;
  }

  .stage {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px 120px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: rgba(20, 26, 55, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 18px;
    padding: 34px 30px 28px;
    box-shadow: 0 25px 60px -15px rgba(0,0,0,0.6);
  }

  .close-x {
    position: absolute;
    top: 16px;
    right: 18px;
    font-size: 1rem;
    color: #d8dcf0;
    cursor: pointer;
    opacity: 0.8;
  }
  .close-x:hover { opacity: 1; }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    margin: 4px 0 26px;
    letter-spacing: 0.01em;
  }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 0.78rem;
    color: #c7ccec;
    margin-bottom: 6px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 11px 38px 11px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  input::placeholder { color: rgba(255,255,255,0.4); }

  input:focus {
    border-color: #8fa8ff;
    background: rgba(255,255,255,0.12);
  }

  input.invalid { border-color: #ff8484; }

  .icon {
    position: absolute;
    right: 12px;
    width: 15px;
    height: 15px;
    opacity: 0.7;
    pointer-events: none;
  }

  .toggle-pw {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    color: #b7bfe8;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    padding: 4px;
  }
  .toggle-pw:hover { color: #fff; }

  .err-msg {
    display: none;
    color: #ff9c9c;
    font-size: 0.72rem;
    margin-top: 6px;
    line-height: 1.4;
  }
  .field.has-error .err-msg { display: block; }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 22px;
    font-size: 0.78rem;
    color: #c7ccec;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .remember input {
    width: auto;
    padding: 0;
    accent-color: #8fa8ff;
  }

  .row-between a {
    color: #c7ccec;
    text-decoration: none;
  }
  .row-between a:hover { color: #fff; }

  button.submit {
    width: 100%;
    padding: 12px;
    background: #10142c;
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  button.submit:hover { background: #1b2148; }
  button.submit:active { transform: scale(0.99); }
  button.submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .status {
    display: none;
    margin-top: 14px;
    padding: 9px 11px;
    border-radius: 7px;
    font-size: 0.78rem;
    text-align: center;
  }
  .status.show { display: block; }
  .status.success { background: rgba(70, 200, 120, 0.18); color: #8ff0ae; border: 1px solid rgba(70,200,120,0.35); }
  .status.error { background: rgba(255, 90, 90, 0.15); color: #ff9c9c; border: 1px solid rgba(255,90,90,0.35); }

  .foot {
    text-align: center;
    margin-top: 18px;
    font-size: 0.78rem;
    color: #c7ccec;
  }
  .foot a { color: #fff; text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    nav { display: none; }
    .stage { padding-top: 60px; }
  }
</style>
</head>
<body>

<div class="backdrop"></div>
<div class="stars"></div>
<div class="shooting-star"></div>
<div class="shooting-star s2"></div>
<div class="shooting-star s3"></div>
<div class="skyline"></div>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
  <a href="/" class="contact-btn">Login</a>
</nav>

<div class="stage">
  <div class="card">
    <span class="close-x">&times;</span>
    <h1>Login</h1>

    <form id="loginForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="yourname@gmail.com" autocomplete="username">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
        </div>
        <p class="err-msg" id="emailErr">Email must end with @gmail.com</p>
      </div>

      <div class="field" id="pwField">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
          <button type="button" class="toggle-pw" id="togglePw">SHOW</button>
        </div>
        <p class="err-msg" id="pwErr">Min 8 characters, with letters and numbers (special characters allowed).</p>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="submit" id="submitBtn">Login</button>

      <div class="status" id="statusMsg"></div>
    </form>

    <p class="foot">Don't have an account? <a href="#">Register</a></p>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const emailField = document.getElementById('emailField');
  const pwField = document.getElementById('pwField');
  const togglePw = document.getElementById('togglePw');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Email must end with @gmail.com
  const emailRegex = /^[^\s@]+@gmail\.com$/i;

  // Password: min 8 chars, at least one letter AND one digit, special characters optional/allowed
  const pwRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]{8,}$/;

  togglePw.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    togglePw.textContent = isHidden ? 'HIDE' : 'SHOW';
  });

  function setError(field, input, hasError) {
    field.classList.toggle('has-error', hasError);
    input.classList.toggle('invalid', hasError);
  }

  emailInput.addEventListener('input', () => {
    if (emailInput.value.length === 0) { setError(emailField, emailInput, false); return; }
    setError(emailField, emailInput, !emailRegex.test(emailInput.value.trim()));
  });

  pwInput.addEventListener('input', () => {
    if (pwInput.value.length === 0) { setError(pwField, pwInput, false); return; }
    setError(pwField, pwInput, !pwRegex.test(pwInput.value));
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    statusMsg.className = 'status';

    const emailVal = emailInput.value.trim();
    const pwVal = pwInput.value;

    const emailOk = emailRegex.test(emailVal);
    const pwOk = pwRegex.test(pwVal);

    setError(emailField, emailInput, !emailOk);
    setError(pwField, pwInput, !pwOk);

    if (!emailOk || !pwOk) {
      statusMsg.textContent = 'Please fix the errors above and try again.';
      statusMsg.classList.add('show', 'error');
      return;
    }

    // Replace this block with a real fetch() call to your backend:
    // fetch('/api/login', { method: 'POST', body: JSON.stringify({ email: emailVal, password: pwVal }) })
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

   setTimeout(() => {

  window.location.href = "/profile";

}, 900);
  });
</script>

</body>
</html>
